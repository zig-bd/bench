name: pages

on:
  workflow_dispatch:

  workflow_call:
    inputs:
      results_artifact:
        description: "Optional artifact name containing app/results.zon from the bench merge job"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download merged bench results
        if: ${{ inputs.results_artifact != '' }}
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.results_artifact }}
          path: app

      - name: Require results.zon
        run: |
          if [ ! -f app/results.zon ]; then
            echo "error: app/results.zon missing — run the bench workflow (or pass results_artifact)" >&2
            exit 1
          fi

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-size-limit: 0
          use-tool-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Site
        run: zig build zx -- build --static

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
